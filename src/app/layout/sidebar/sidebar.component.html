<aside class="sidebar" [class.sidebar--open]="open" aria-label="Sidebar navigation">
  <div class="sidebar__brand">
    <span class="sidebar__logo" aria-hidden="true">
      <mat-icon>account_balance_wallet</mat-icon>
    </span>
    <span class="sidebar__app-name">Expense Tracker</span>
  </div>
  <nav class="sidebar__nav">
    <ul>
      @for (item of navItems; track item.label) {
        <li>
          <a
            class="sidebar__link"
            [routerLink]="item.link"
            routerLinkActive="sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: item.link === '/dashboard' }"
            (click)="navigate.emit()"
          >
            <mat-icon class="sidebar__icon" aria-hidden="true">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
